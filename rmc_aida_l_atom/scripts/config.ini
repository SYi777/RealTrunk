;双臂
[Arms]
left_ip = 169.254.128.18
right_ip = 169.254.128.19
port = 8080

;知行夹爪
[Zhi_Xing]
pose=2000
baudrate=115200
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）

;强脑手
[Brain_Co]
baudrate=115200
thumb_flex = 100    ;大拇指旋转关节的角度0～100
thumb_aux = 100     ;大拇指弯曲关节最大角度
four_finger = 70    ;四指旋转最大角度
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）

;傲意手
[Oy_Motion]
baudrate=115200
thumb_flex = 100    ;大拇指旋转关节的角度0～100
thumb_aux = 100     ;大拇指弯曲关节最大角度
four_finger = 100   ;四指旋转最大角度
high_vel = 95       ;抓握高速
low_vel = 50        ;抓握低速
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）

;aubot夹爪
[Dhag_Gripper]
baudrate=115200
force_percent = 60 ;抓握力度百分比
position_percent = 100  ;打开位置百分比
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）

;自研底盘
[Chassis_Self]
port=/dev/ttybase
baudrate=115200

abs_linear_speed=0.15
abs_angular_speed=0.1
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）

;power
[Robot_Power]
port=/dev/ttypower
baudrate=115200

;头部舵机
[Head_Servo]
port=/dev/rmUSB3
baudrate=9600
frequency=15
listen_port=9999    ;监听按键端口
listen_ip=169.254.128.255   ;监听按键ip（0.0.0.0和<空>的意思是监听所有端口）
publisher_port=9996 ;发布头部数据端口
publisher_ip=169.254.128.255    ;发布头部数据ip