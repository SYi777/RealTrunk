;具身双臂遥操作程序的相关配置，程序启动前根据实际硬件连接配置进行修改保存

;基于tcp连接的服务器控制双臂数据采集
[Tcp_Service]
service_port = 8000
service_ip = 169.254.128.20  ;建议该成机器人本地网络的ip

;左主从臂相关配置
[Left_Arm]
master_port = /dev/rmUSB0   ;主臂485连接到主控上对应串口名
master_baud = 460800        ;主臂串口通讯波特率
slave_ip = 169.254.128.18   ;从臂机械臂IP地址
slave_port = 8080           ;从臂机械臂端口号
follow_mode=1               ;从臂机械臂跟随控制模式[0:低跟随、1：高跟随、2：关节空间跟随]
udp_port=19997               ;UDP发布主臂数据（关节角度+夹爪开合度）的端口号
udp_ip=127.0.0.1      ;UDP发布主臂数据IP，128内网发送
tag=left                    ;主臂标签信息
filter_depth=10             ;对主臂数据进行滤波的深度
calibrate_speed=10          ;校准速度百分比
gripper_enable=0            ;是否启用因时夹爪控制，1为启用，0为不启用

;右主从臂相关配置，参照左主从臂相关参数解释
[Right_Arm]
master_port = /dev/rmUSB1
master_baud = 460800
slave_ip = 169.254.128.19
slave_port = 8080
follow_mode=1
udp_port=19998
udp_ip=127.0.0.1      ;UDP发布主臂数据IP，128内网发送
tag=right
filter_depth=10
calibrate_speed=10          ;校准速度百分比
gripper_enable=0           ;是否启用因时夹爪控制，1为启用，0为不启用

;IO数字量输入模块相关配置(主臂上的按键都连接到一个IO数字量输入模块上，通过USB485与主控通讯)
[IO]
port = /dev/rmUSB2          ;IO数字量输入模块连接到主控上对应的串口名
baud = 38400                ;IO模块串口通信波特率
udp_port=9999               ;UDP发布IO模块（按键）数据的端口号
udp_ip=169.254.128.255      ;UDP发布主臂数据IP，128内网发送

;升降导轨相关配置
[Lift]
enable = 1                  ;是否启用默认升降
ip = 169.254.128.18         ;控制升降导轨机械臂的IP地址
port = 8080                 ;控制升降导轨机械臂的端口号
speed = 50                  ;升降导轨运动速度比例(1~100)

;移动底盘相关配置
[AGV]
enable = 1                  ;是否启用默认底盘
ip = 169.254.128.2          ;AGV底盘通讯IP地址
port = 5410                 ;AGV底盘通讯端口号
linear_speed = 0.2          ;AGV最大线速度
angular_speed = 0.4         ;AGV最大角速度
